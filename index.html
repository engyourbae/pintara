    <style>
      /* Splash: tampil seketika sebelum JS siap; dihapus SplashGate setelah aplikasi siap. */
      #splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;background:#FBF6E9;transition:opacity .35s ease}
      #splash.bye{opacity:0;pointer-events:none}
      #splash b{font:700 26px/1 system-ui,sans-serif;color:#2A3328;letter-spacing:.06em}
      #splash p{margin:0;min-height:2.6em;max-width:20em;font:500 15px/1.35 system-ui,sans-serif;color:#4a5547}
      #splash button{font:700 16px system-ui,sans-serif;color:#2A3328;background:#FFFDF6;border:2px solid #2A3328;border-radius:16px;padding:12px 22px;box-shadow:0 3px 0 #2A3328}
      .lo-svg{width:min(72vw,260px);height:auto;overflow:visible}
      .lo-body{transform-box:fill-box;transform-origin:50% 100%;animation:lo-hop 1.3s ease-in-out infinite}
      .lo-wl{transform-box:fill-box;transform-origin:100% 0%;animation:lo-flapl 1.3s ease-in-out infinite}
      .lo-wr{transform-box:fill-box;transform-origin:0% 0%;animation:lo-flapr 1.3s ease-in-out infinite}
      .lo-pen{transform-box:fill-box;transform-origin:50% 100%;animation:lo-pen .9s ease-in-out infinite}
      .lo-eyes{transform-box:fill-box;transform-origin:center;animation:lo-blink 4.6s ease-in-out infinite}
      .lo-shadow{transform-box:fill-box;transform-origin:center;animation:lo-shadow 1.3s ease-in-out infinite}
      .lo-sym{transform-box:fill-box;transform-origin:center;opacity:0;animation:lo-rise 2.8s ease-in-out infinite}
      .lo-sym.s2{animation-delay:.55s}.lo-sym.s3{animation-delay:1.1s}.lo-sym.s4{animation-delay:1.65s}.lo-sym.s5{animation-delay:2.2s}
      .lo-star{transform-box:fill-box;transform-origin:center;animation:lo-star 1.5s ease-in-out infinite}
      .lo-star.t2{animation-delay:.25s}.lo-star.t3{animation-delay:.5s}
      @keyframes lo-hop{0%,100%{transform:translateY(0) scale(1.05,.94)}40%{transform:translateY(-20px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.04,.95)}85%{transform:translateY(-4px) scale(1,1)}}
      @keyframes lo-flapl{0%,100%{transform:rotate(0)}40%{transform:rotate(24deg)}}
      @keyframes lo-flapr{0%,100%{transform:rotate(0)}40%{transform:rotate(-24deg)}}
      @keyframes lo-pen{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-5deg)}}
      @keyframes lo-shadow{0%,100%{transform:scaleX(1);opacity:.22}40%{transform:scaleX(.7);opacity:.1}}
      @keyframes lo-rise{0%{opacity:0;transform:translateY(14px) scale(.7)}25%,70%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1.1) rotate(8deg)}}
      @keyframes lo-star{0%,100%{transform:scale(.7);opacity:.35}50%{transform:scale(1.15);opacity:1}}
      @keyframes lo-fade{0%,100%{opacity:.2}50%{opacity:1}}
      @keyframes lo-starfade{0%,100%{opacity:.35}50%{opacity:1}}
      /* Kedip: jeda 2 dtk -> kedip 1x, jeda 2 dtk -> kedip 2x, lalu ulang. Siklus 4,6 dtk. */
      @keyframes lo-blink{0%,43.5%,47%,90%,93.4%,94.6%,98%,100%{transform:scaleY(1)}45.2%,91.6%,96.2%{transform:scaleY(.1)}}
      @media (prefers-reduced-motion:reduce){
      .lo-body,.lo-wl,.lo-wr,.lo-pen,.lo-shadow{animation:none !important}
      .lo-sym{animation:lo-fade 2.8s ease-in-out infinite !important}
      .lo-star{animation:lo-starfade 1.5s ease-in-out infinite !important}
      .lo-eyes{animation:lo-blink 4.6s ease-in-out infinite !important}
      }
    </style>
  </head>
  <body>
    <noscript>PINTARA membutuhkan JavaScript agar dapat dijalankan.</noscript>

      <text class="lo-sym s2" x="226" y="112" fill="#F5C000">7</text>
      <text class="lo-sym s3" x="10" y="64" fill="#7CC4F0">+</text>
      <text class="lo-sym s4" x="230" y="58" fill="#F28A3B">?</text>
      <text class="lo-sym s5" x="222" y="170" fill="#478F3A">B</text>
      </g>

      <g class="lo-body">
      <g stroke="#2A3328" stroke-width="4">
      <path d="M52 52L60 20L90 44Z" fill="#478F3A"/>
      <path d="M148 52L140 20L110 44Z" fill="#478F3A"/>
      <ellipse cx="82" cy="186" rx="13" ry="6" fill="#F28A3B" stroke-width="3"/>
      <ellipse cx="118" cy="186" rx="13" ry="6" fill="#F28A3B" stroke-width="3"/>
      <g class="lo-wl"><path d="M42 108Q22 140 40 170Q56 152 54 118Z" fill="#478F3A"/></g>
      <g class="lo-wr"><path d="M158 108Q178 140 160 170Q144 152 146 118Z" fill="#478F3A"/></g>
      <ellipse cx="100" cy="112" rx="62" ry="70" fill="#5BAA4B"/>
      <ellipse cx="100" cy="132" rx="38" ry="42" fill="#FFFDF6" stroke-width="0"/>
      <path d="M82 124q6 6 12 0M106 124q6 6 12 0M88 142q6 6 12 0M100 142q6 6 12 0" fill="none" stroke="#9FD093" stroke-width="3"/>

      </g></g>

      </g>
      <path d="M91 104L109 104L100 118Z" fill="#F5C000" stroke="#2A3328" stroke-width="3.5"/>

      <g transform="translate(88,236)"><path class="lo-star" d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z" fill="#F5C000"/></g>
      <g transform="translate(118,236)"><path class="lo-star t2" d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z" fill="#F5C000"/></g>
      <g transform="translate(148,236)"><path class="lo-star t3" d="M12 2l2.6 6.4L21 11l-6.4 2.6L12 20l-2.6-6.4L3 11l6.4-2.6z" fill="#F5C000"/></g>
      </g>
      </svg>
      <b>PINTARA</b>
      <p id="sp-msg">Pinta lagi menyiapkan pensil…</p>
      <button id="sp-retry" type="button" hidden onclick="location.reload()">Muat ulang</button>
    </div>
    <script>
      /* Pesan bergantian di splash; berjalan walau JS aplikasi macet. Lambat >10 dtk: pesan sabar; >20 dtk: tombol Muat ulang. */
      (function () {
        var tips = ['Pinta lagi menyiapkan pensil…', 'Menata buku pelajaran…', 'Mengasah otak biar tajam…', 'Menghitung bintang…'];
        var i = 0, t0 = Date.now();
        var timer = setInterval(function () {
          var s = document.getElementById('splash'), m = document.getElementById('sp-msg');
          if (!s) { clearInterval(timer); return; }
          var d = Date.now() - t0;
          if (d > 20000) document.getElementById('sp-retry').hidden = false;
          if (d > 10000) { m.textContent = 'Koneksi atau perangkat agak lambat. Sabar ya, Pinta masih berusaha!'; return; }
          i = (i + 1) % tips.length; m.textContent = tips[i];
        }, 2600);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

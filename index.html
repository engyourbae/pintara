    <meta name="theme-color" content="#5BAA4B" />
    <meta name="color-scheme" content="light" />

    <!-- Ikon -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- Open Graph / pratinjau tautan -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PINTARA" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:title" content="PINTARA — Belajar Bersama, Berkembang Bersama!" />
    <meta property="og:description" content="Platform belajar dan game edukasi untuk anak SD Indonesia." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PINTARA — Belajar Bersama, Berkembang Bersama!" />

    <!-- Aplikasi web -->
    <meta name="application-name" content="PINTARA" />
    <meta name="apple-mobile-web-app-title" content="PINTARA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      /* Splash: tampil seketika sebelum JS siap; dihapus main.tsx setelah aplikasi tampil. */
      #splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#FBF6E9;transition:opacity .3s ease}
      #splash.bye{opacity:0;pointer-events:none}
      #splash img{width:92px;height:92px}
      #splash b{font:700 26px/1 system-ui,sans-serif;color:#2A3328;letter-spacing:.06em}
      #splash i{display:flex;gap:8px}
      #splash i span{width:12px;height:12px;border-radius:50%;background:#F5C000;border:2px solid #2A3328}
      @media (prefers-reduced-motion:no-preference){
        #splash img{animation:sp-float 1.6s ease-in-out infinite}
        #splash i span{animation:sp-dot .9s ease-in-out infinite}
        #splash i span:nth-child(2){animation-delay:.15s}
        #splash i span:nth-child(3){animation-delay:.3s}
      }
      @keyframes sp-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
      @keyframes sp-dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
  </head>
  <body>
    <noscript>PINTARA membutuhkan JavaScript agar dapat dijalankan.</noscript>
    <div id="splash" aria-hidden="true">
      <img src="%BASE_URL%favicon.svg" alt="" width="92" height="92" />
      <b>PINTARA</b>
      <i><span></span><span></span><span></span></i>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
